[project]
name = "attnlab"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Implementing attention layers for benchmarking"
readme = "README.md"
authors = [
    { name = "Samuel Lee", email = "137744681+SamuelWLee27@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[project.scripts]
attnlab = "attnlab:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
